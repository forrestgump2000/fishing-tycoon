<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../js/data.js"></script><script src="../js/art.js"></script>
<script>
// ?mode=icon (square app icon) | ?mode=thumb (1200x630 social/thumbnail)
const mode = new URLSearchParams(location.search).get('mode') || 'icon';
const c = document.getElementById('c');
const W = mode === 'thumb' ? 1200 : 512, H = mode === 'thumb' ? 630 : 512;
c.width = W; c.height = H;
const x = c.getContext('2d');
const T = mode === 'icon' ? 0.6 : 2.2;
function put(id, px, py, size, rot, flip) { const sp = FT.BY_ID[id]; x.save(); x.translate(px, py); if (flip) x.scale(-1, 1); x.rotate(rot || 0); Art.creature(x, sp, size, T); x.restore(); }
function title(txt, px, py, fs) {
  x.save(); x.font = fs + "px 'Lilita One'"; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  x.lineWidth = fs * 0.22; x.strokeStyle = '#1d2235'; x.strokeText(txt, px, py + fs * 0.06);
  const g = x.createLinearGradient(0, py - fs / 2, 0, py + fs / 2); g.addColorStop(0, '#fff3a0'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#ff9a1f');
  x.fillStyle = g; x.fillText(txt, px, py); x.restore();
}
function draw() {
  if (mode === 'icon') {
    const loc = FT.LOCATIONS[7];
    Art.backdrop(x, loc, W, 200, 1.5);
    Art.water(x, loc, W, H, -200, 520, 1.5);
    Art.surface(x, loc, W, 200, 1.5);
    // fishing line from the top into the fish's mouth
    x.strokeStyle = 'rgba(255,255,255,0.95)'; x.lineWidth = 4; x.beginPath(); x.moveTo(470, -10); x.quadraticCurveTo(450, 120, 397, 228); x.stroke();
    // splash
    x.fillStyle = '#e8f8ff'; x.strokeStyle = '#1d2235'; x.lineWidth = 3;
    for (let i = 0; i < 9; i++) { const a = Math.PI + i / 8 * Math.PI; x.beginPath(); x.arc(250 + Math.cos(a) * 170, 215 + Math.sin(a) * 45, 9 + (i % 3) * 4, 0, 6.3); x.fill(); x.stroke(); }
    put('pond:largemouth-bass:golden', 275, 275, 295, -0.35);
    put('reef:clownfish', 92, 430, 120, 0.1);
    put('reef:blue-tang', 420, 445, 110, -0.1, true);
  } else {
    const loc = FT.LOCATIONS[7];
    Art.backdrop(x, loc, W, 300, 1.5);
    Art.water(x, loc, W, H, -300, 700, 1.5);
    Art.seabed(x, loc, W, 610, 1.5);
    Art.surface(x, loc, W, 300, 1.5);
    const tip = Art.fisher(x, loc, 130, 300, 1.25, 1.5, -1.0, FT.RODS[12]);
    x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = 2.5; x.beginPath(); x.moveTo(tip.x, tip.y); x.quadraticCurveTo(330, 260, 420, 300); x.lineTo(420, 470); x.stroke();
    Art.bobber(x, 420, 300, 1.4, 1.5, false);
    put('fabled:kraken', 1070, 470, 230);
    put('fabled:megalodon', 760, 520, 330, -0.05, true);
    put('reef:clownfish', 420, 500, 110, 0.15, true);
    put('reef:pufferfish', 250, 560, 90, 0);
    put('fabled:mermaid', 580, 395, 160, 0.1);
    put('reef:queen-angelfish', 960, 360, 100, 0, true);
    put('tropical:mahi-mahi:rainbow', 360, 395, 130, 0.05);
    title('FISHING TYCOON', 760, 150, 112);
    x.save(); x.font = "34px 'Lilita One'"; x.textAlign = 'center'; x.fillStyle = '#fff'; x.strokeStyle = '#1d2235'; x.lineWidth = 8; x.lineJoin = 'round';
    x.strokeText('8,000+ creatures · 20 locations · 1 raggity rod', 760, 238); x.fillText('8,000+ creatures · 20 locations · 1 raggity rod', 760, 238); x.restore();
  }
  document.title = 'ready';
}
document.fonts.load("40px 'Lilita One'").then(draw, draw);
</script></body></html>
